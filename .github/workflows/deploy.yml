name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Fixtures still match the vendored oracle
        run: npm run verify-fixtures

      # Published as a project page at nealedj.github.io/igc-analyser/, so the
      # assets have to be addressed from that subpath. Nothing in the source
      # knows about it: moving to a custom domain at a root is BASE_PATH=/ plus
      # a step writing dist/CNAME, and no code change.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /igc-analyser/

      # No server-side routing, but a 404 that loads the app keeps a mistyped
      # deep link from being a dead end.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # A built page references a hashed bundle under the base path and never
      # the TypeScript entry point. Getting this wrong publishes a blank page
      # that looks like a successful deploy, so fail here instead.
      - name: Check the build is a built page
        run: |
          set -euo pipefail
          if grep -q 'src/main.ts' dist/index.html; then
            echo "::error::dist/index.html still points at the TypeScript source."
            exit 1
          fi
          if ! grep -q '/igc-analyser/assets/.*\.js' dist/index.html; then
            echo "::error::dist/index.html has no bundle at the expected base path."
            grep -o '<script[^>]*>' dist/index.html || true
            exit 1
          fi
          echo "dist/index.html references $(grep -o '/igc-analyser/assets/[^"]*\.js' dist/index.html)"

      # enablement: true lets this switch Pages to the Actions source itself.
      # Without it, a repository whose Pages source is still "Deploy from a
      # branch" fails here after a green build - and, worse, keeps quietly
      # serving the repository root, so the site looks deployed and is blank.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
