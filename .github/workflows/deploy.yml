name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Fixtures still match the vendored oracle
        run: npm run verify-fixtures

      # Published as a project page at nealedj.github.io/igc-analyser/, so the
      # assets have to be addressed from that subpath. Nothing in the source
      # knows about it: moving to a custom domain at a root is BASE_PATH=/ plus
      # a step writing dist/CNAME, and no code change.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /igc-analyser/

      # No server-side routing, but a 404 that loads the app keeps a mistyped
      # deep link from being a dead end.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
